name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun x tsc --noEmit

      # This repo shipped a real bug once: the permissions.allow rule for the
      # canvas CLI was missing the word "run", so it silently matched none of
      # the `bun run .../cli.js ...` invocations documented in
      # canvas/skills and canvas/commands. This re-derives coverage on every
      # run instead of trusting that the rule still matches.
      - name: Documented CLI invocations are covered by settings.json
        run: bun run lint:permissions

      # SKILL.md docs have drifted out of sync with the code they describe
      # more than once (stale keybindings, a stale onGet claim, an
      # advertised-but-removed feature). This catches the cheap, mechanical
      # slice of that: every canvas kind cli.ts implements has a skill doc,
      # and every skill doc names a kind that still exists.
      - name: Skill docs match implemented canvas kinds
        run: bun run lint:skills

      # package.json (root and canvas/), the plugin manifest, and the
      # marketplace listing each carry a version number; nothing enforced
      # they agree, and they drifted (both package.json files sat at 0.1.0
      # while the user-facing plugin manifest and marketplace listing had
      # already moved to 0.2.0).
      - name: Version numbers are in sync
        run: bun run check:versions

      # canvas/dist/cli.js is a build artifact in version control, because a
      # plugin install is a git clone with no node_modules and the skills have
      # to run something that needs none. The cost is that it can go stale
      # silently; this is what stops that.
      - name: Bundle is current
        run: bun run build:check

      # Proves the shipped bundle needs no node_modules, which is the only
      # reason it exists: a plugin install is a git clone, and anything that
      # imports ink at runtime cannot render there. Run in a directory
      # holding nothing but the bundle.
      - name: Bundle runs with no dependencies
        run: bun run scripts/check-standalone.ts

      - name: Test
        run: bun test
