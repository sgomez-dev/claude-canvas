name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun x tsc --noEmit

      # canvas/dist/cli.js is a build artifact in version control, because a
      # plugin install is a git clone with no node_modules and the skills have
      # to run something that needs none. The cost is that it can go stale
      # silently; this is what stops that.
      - name: Bundle is current
        run: bun run build:check

      - name: Test
        run: bun test
