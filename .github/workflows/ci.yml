name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun x tsc --noEmit

      # canvas/dist/cli.js is a build artifact in version control, because a
      # plugin install is a git clone with no node_modules and the skills have
      # to run something that needs none. The cost is that it can go stale
      # silently; this is what stops that.
      - name: Bundle is current
        run: bun run build:check

      # Proves the shipped bundle needs no node_modules, which is the only
      # reason it exists: a plugin install is a git clone, and anything that
      # imports ink at runtime cannot render there. Run in a directory
      # holding nothing but the bundle.
      - name: Bundle runs with no dependencies
        run: bun run scripts/check-standalone.ts

      - name: Test
        run: bun test
